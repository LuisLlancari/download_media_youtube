<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <title>Descargar Multimedia</title>
</head>

<body>

  <div class="w-50 mx-auto mt-5">
    <p class="text-center fw-bold">Descargar Música y Videos de YouTube</p>




    <div class="row">
      <div class="col-md-8">
        <input type="text" id="url-input" class="form-control" placeholder="Ingrese la URL de YouTube">
        <p id="error-message" class="text-danger"></p>
      </div>
      <div class="col-md-4">
        <button id="search-btn" type="button" class="btn btn-primary">
          <span class="spinner-border spinner-border-sm d-none" role="status"></span>
          <span class="btn-text">Buscar</span>
        </button>
      </div>
    </div>


    <div class="mt-3 d-none" id="result">
      <ul class="nav nav-pills mb-3" id="pills-tab" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="pills-home-tab" data-bs-toggle="pill" data-bs-target="#pills-home"
            type="button" role="tab" aria-controls="pills-home" aria-selected="true">Audio</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="pills-profile-tab" data-bs-toggle="pill" data-bs-target="#pills-profile"
            type="button" role="tab" aria-controls="pills-profile" aria-selected="false">Video</button>
        </li>
      </ul>
      <!--- Info Content --->

      <div class="row">
        <div class="col-md-6">
          <p class="fw-bold" id="media-title">title</p>
          <img id="media-image" src="#" class="img-thumbnail">
        </div>

        <div class="col-md-6">

          <div class="tab-content" id="pills-tabContent">
            <!--- Audio Content --->
            <div class="tab-pane fade show active" id="pills-home" role="tabpanel" aria-labelledby="pills-home-tab"
              tabindex="0">
              <label for="" class="form-label fw-bold">Calidad de Audio</label>
              <select id="audio-quality" class="form-select" aria-label="Default select example">
                <option class="disabled" selected>Seleccionar calidad</option>
              </select>

              <button id="download-audio-btn" type="button" class="btn btn-success mt-3">
                <span class="spinner-border spinner-border-sm d-none" role="status"></span>
                <span class="btn-text">Descargar</span>
              </button>

            </div>

            <!--- Video Content --->
            <div class="tab-pane fade" id="pills-profile" role="tabpanel" aria-labelledby="pills-profile-tab"
              tabindex="0">
              <label for="" class="form-label fw-bold">Calidad de Video</label>
              <select id="video-quality" class="form-select" aria-label="Default select example">
                <option class="disabled" selected>Seleccionar calidad</option>
              </select>

              <button id="download-video-btn" type="button" class="btn btn-success mt-3">
                <span class="spinner-border spinner-border-sm d-none" role="status"></span>
                <span class="btn-text">Descargar</span>
              </button>

            </div>

          </div>
        </div>
      </div>


    </div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="js/page.js" type="module"></script>
</body>

</html>
